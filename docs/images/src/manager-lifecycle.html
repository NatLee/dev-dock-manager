<!doctype html>
<!--
  Lifecycle of one environment in the manager: log in, create, notification, terminal, desktop, start/stop.
  The same source is used by dev-dock-manager (Django) and dev-dock-manager-rust (Rust).
  The hash picks the variant and the theme: #django, #django-dark, #rust, #rust-dark. Render with e.g.
    msedge --headless=new --hide-scrollbars --force-device-scale-factor=2 --window-size=960,740
           --default-background-color=00000000 --virtual-time-budget=5000
           --screenshot=lifecycle-dark.png "file:///…/manager-lifecycle.html#rust-dark"
  then convert to WebP (magick lifecycle-dark.png -quality 90 lifecycle-dark.webp).
  Endpoints, messages and token lifetimes come from the frontend and backend source of each repo.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dev Dock Manager lifecycle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="diagram.css">
<style>
  body, .frame { width: 960px; height: 740px; }
  .lane { position: absolute; top: 116px; width: 134px; margin-left: -67px; text-align: center; padding: 9px 8px; }
  .lane .label { justify-content: center; }
  .lane .sub { margin-top: 3px; font-size: 11.5px; }
  .life { stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 2 5; }
  .msg { position: absolute; font-size: 12px; color: var(--ink); white-space: nowrap; line-height: 1.3;
         background: var(--bg); padding: 1px 6px; border-radius: 6px; }
  .msg code { font-size: 11.5px; }
  .msg.reply { color: var(--muted); }
  .msg .num { width: 18px; height: 18px; font-size: 10.5px; vertical-align: 1px; margin-right: 2px; }
  .note2 { position: absolute; font-size: 11px; color: var(--muted); white-space: nowrap; line-height: 1.35; background: var(--bg); padding: 0 4px; border-radius: 4px; }
  .note2 code { font-size: 10.5px; }
  .wire.reply { stroke-dasharray: 4 5; }
</style>
</head>
<body>
<script>
  const h = location.hash;
  if (h.includes('dark')) document.documentElement.className = 'dark';
  const V = h.includes('rust') ? 'rust' : 'django';
</script>
<div class="frame">
  <div class="dots"></div>

  <header>
    <div class="mark">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="24" height="17" rx="3"/>
        <path d="M8.5 10.5l3 2.5-3 2.5M14.5 15.5h5"/>
        <path d="M10 26h10M15 21v5"/>
      </svg>
    </div>
    <div>
      <h1 id="name"></h1>
      <p class="tag">From <b>login</b> to a <b>terminal</b> and a <b>desktop</b>: what each click does.</p>
    </div>
  </header>

  <svg class="wires" id="svg" width="960" height="740"></svg>
  <div id="layer"></div>
</div>
<script>
  const X = { B: 110, A: 404, W: 590, D: 736, C: 876 };
  const T = {
    django: {
      name: 'dev-dock-manager',
      api: ['API', 'c-green', 'Django'], worker: ['Queue', 'c-red', 'Redis + rqworker'],
      tokens: 'access 60 h, refresh 1 day',
      ws: 'subprotocols <code>token.&lt;base64 JWT&gt;</code>, <code>container.&lt;id&gt;</code>',
      notify: 'pushed through a Channels group in Redis',
    },
    rust: {
      name: 'dev-dock-manager-rust',
      api: ['API', 'c-orange', 'Rust'], worker: ['Queue', 'c-red', 'Redis + worker task'],
      tokens: 'access 1 h, refresh 1 day',
      ws: '<code>?container=&lt;id&gt;</code>, JWT in the first message',
      notify: 'pushed through an in-process broadcast',
    },
  }[V];
  document.getElementById('name').textContent = T.name;

  const lanes = [
    ['B', 'You', 'c-blue', 'Browser'],
    ['A', T.api[0], T.api[1], T.api[2]],
    ['W', T.worker[0], T.worker[1], T.worker[2]],
    ['D', 'Docker', 'c-teal', 'docker.sock'],
    ['C', 'Desktop', 'c-green', 'gui-vnc container'],
  ];
  // [from, to, y, html, kind]  kind: '' | 'reply'; one label per row, the rest go in notes below the line
  const msgs = [
    ['B', 'A', 200, '<span class="num">1</span> Log in: <code>POST /api/auth/token</code>'],
    ['A', 'B', 234, 'access + refresh JWT, kept in localStorage', 'reply'],
    ['B', 'A', 296, '<span class="num">2</span> Create: <code>POST /dashboard/api/container/new</code>'],
    ['A', 'W', 296, ''],
    ['A', 'B', 330, '<code>task_id</code>', 'reply'],
    ['W', 'D', 390, '<span class="num">3</span> create + start'],
    ['D', 'C', 390, ''],
    ['W', 'B', 456, '<span class="num">4</span> <code>CREATED</code> on <code>/ws/notifications/</code>, the list refreshes', 'reply'],
    ['B', 'A', 520, '<span class="num">5</span> Console: WebSocket <code>/ws/console/</code>'],
    ['A', 'D', 520, ''],
    ['D', 'C', 520, ''],
    ['C', 'B', 582, 'terminal output ⇄ <code>pty_input</code>, <code>pty_resize</code>', 'reply'],
    ['B', 'C', 640, '<span class="num">6</span> NoVNC: <code>/novnc/&lt;name&gt;/?path=novnc/&lt;name&gt;/websockify</code> → Traefik → noVNC :6901'],
    ['B', 'A', 698, '<span class="num">7</span> Start / stop: <code>POST /dashboard/api/containers/control</code>'],
    ['A', 'W', 698, ''],
    ['W', 'D', 698, ''],
  ];
  const notes = [
    [X.B + 12, 242, T.tokens, 'start'],
    [X.A + 10, 304, 'checks the name and SSH port,<br>queues a job, answers right away', 'start'],
    [X.C - 6, 398, 'env passwords, <code>22/tcp</code> → SSH port,<br>Traefik labels, <code>d-gui-network</code>', 'end'],
    [X.W - 10, 464, T.notify, 'end'],
    [X.B + 12, 528, T.ws, 'start'],
    [X.D - 10, 528, '<code>exec /bin/bash</code> or <code>attach</code>', 'end'],
    [X.C - 6, 648, 'asks for the VNC password', 'end'],
    [X.A + 10, 706, '<code>WAITING</code>, then <code>STARTED</code>, <code>STOPPED</code> … on /ws/notifications/', 'start'],
  ];

  const svg = document.getElementById('svg'), layer = document.getElementById('layer');
  const NS = 'http://www.w3.org/2000/svg';
  const add = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; };
  for (const [k, label, color, sub] of lanes) {
    add('line', { class: 'life', x1: X[k], y1: 170, x2: X[k], y2: 724 });
    const d = document.createElement('div');
    d.className = 'node lane'; d.style.left = X[k] + 'px';
    d.innerHTML = `<div class="label ${color}"><i></i>${label}</div><div class="sub"><b>${sub}</b></div>`;
    layer.appendChild(d);
  }
  for (const [f, t, y, html, kind] of msgs) {
    const x1 = X[f], x2 = X[t], dir = x2 > x1 ? 1 : -1;
    add('path', { class: 'wire ' + (kind === 'reply' ? 'reply' : 'solid'), d: `M${x1} ${y} H${x2 - dir * 7}` });
    add('path', { class: 'head', d: `M${x2} ${y} l${-dir * 9} -5 v10 z` });
    if (!html) continue;
    const m = document.createElement('div');
    m.className = 'msg' + (kind === 'reply' ? ' reply' : '');
    m.innerHTML = html;
    layer.appendChild(m);
    const w = m.offsetWidth;
    const left = Math.min(Math.min(x1, x2) + 8, 952 - w);
    m.style.left = left + 'px'; m.style.top = (y - 21) + 'px';
  }
  for (const [x, y, html, align] of notes) {
    const n = document.createElement('div');
    n.className = 'note2'; n.innerHTML = html; layer.appendChild(n);
    n.style.left = (align === 'end' ? x - n.offsetWidth : x) + 'px'; n.style.top = y + 'px';
  }
</script>
</body>
</html>
