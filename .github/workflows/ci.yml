name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: backend tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Same image as docker-compose.yml builds, so the tests run on the same Python and packages.
      - name: Build the backend image
        run: docker build -t backend .
      - name: Settings refuse to load without DJANGO_SECRET_KEY
        run: |
          if docker run --rm backend python manage.py check > out.txt 2>&1; then
            echo "expected manage.py check to fail without DJANGO_SECRET_KEY"; cat out.txt; exit 1
          fi
          grep -q "DJANGO_SECRET_KEY is not set" out.txt
      - name: Migrations are committed
        run: docker run --rm -e DJANGO_SECRET_KEY=ci backend python manage.py makemigrations --check --dry-run
      - name: Tests
        run: docker run --rm -e DJANGO_SECRET_KEY=ci backend python manage.py test --verbosity 2

  startup:
    name: start the stack and log in
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Start backend, frontend, Redis and Traefik
        run: |
          printf 'DJANGO_SECRET_KEY=%s\n' "$(openssl rand -base64 48)" > .env
          docker network create d-gui-network
          docker compose up -d --build backend frontend redis traefik
      - name: Wait for the dashboard and the API behind Traefik
        run: |
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:8000/login && break
            sleep 2
          done
          curl -fsS -o /dev/null -w "GET /login -> %{http_code}\n" http://localhost:8000/login
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -d '{"username":"nobody","password":"wrong"}' http://localhost:8000/api/auth/token)
            [ "$code" = 401 ] && break
            sleep 2
          done
          echo "POST /api/auth/token with bad credentials -> $code"
          test "$code" = 401
      - name: Both backend programs keep running, debug is off
        run: |
          docker exec d-gui-manager-web supervisorctl -c /etc/supervisor/conf.d/supervisord.conf status | tee status.txt
          test "$(grep -c RUNNING status.txt)" = 2
          docker exec d-gui-manager-web python manage.py shell -c "from django.conf import settings; assert not settings.DEBUG, settings.DEBUG"
      - name: Logs
        if: always()
        run: docker compose logs --no-color backend traefik | tail -n 200
