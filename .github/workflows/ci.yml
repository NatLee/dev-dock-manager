name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: backend tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Same image as docker-compose.yml builds, so the tests run on the same Python and packages.
      - name: Build the backend image
        run: docker build -t backend .
      - name: Settings refuse to load without DJANGO_SECRET_KEY
        run: |
          if docker run --rm backend python manage.py check > out.txt 2>&1; then
            echo "expected manage.py check to fail without DJANGO_SECRET_KEY"; cat out.txt; exit 1
          fi
          grep -q "DJANGO_SECRET_KEY is not set" out.txt
      - name: Migrations are committed
        run: docker run --rm -e DJANGO_SECRET_KEY=ci backend python manage.py makemigrations --check --dry-run
      - name: Tests
        run: docker run --rm -e DJANGO_SECRET_KEY=ci backend python manage.py test --verbosity 2

  startup:
    name: start the stack and log in
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Start backend, frontend, Redis and Traefik
        run: |
          printf 'DJANGO_SECRET_KEY=%s\n' "$(openssl rand -base64 48)" > .env
          docker network create d-gui-network
          docker compose up -d --build backend frontend redis traefik
      - name: Wait for the dashboard and the API behind Traefik
        run: |
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:8000/login && break
            sleep 2
          done
          curl -fsS -o /dev/null -w "GET /login -> %{http_code}\n" http://localhost:8000/login
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -d '{"username":"nobody","password":"wrong"}' http://localhost:8000/api/auth/token)
            [ "$code" = 401 ] && break
            sleep 2
          done
          echo "POST /api/auth/token with bad credentials -> $code"
          test "$code" = 401
      - name: Both backend programs keep running on Daphne, debug is off
        run: |
          docker exec d-gui-manager-web supervisorctl -c /etc/supervisor/conf.d/supervisord.conf status | tee status.txt
          test "$(grep -c RUNNING status.txt)" = 2
          # The API is served by Daphne itself, not by the development runserver and its auto-reloader
          docker exec d-gui-manager-web sh -c 'for p in /proc/[0-9]*/cmdline; do tr "\0" " " < "$p"; echo; done' > procs.txt
          grep "backend.asgi:application" procs.txt
          if grep "manage.py runserver" procs.txt; then echo "runserver is still running"; exit 1; fi
          docker exec d-gui-manager-web python manage.py shell -c "from django.conf import settings; assert not settings.DEBUG, settings.DEBUG"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Two ways the dashboard's WebSockets broke: tokens of user ids 10-99 made a subprotocol browsers
      # refuse, and redis-py 8 cut the channel layer's 5-second Redis wait off. So: user id 10, a socket
      # opened with the dashboard's own subprotocol code, held well past 5 seconds, then a notification.
      - name: A notification WebSocket stays open and still receives (user id 10)
        run: |
          docker exec d-gui-manager-web python manage.py shell -c \
            "from django.contrib.auth.models import User; User.objects.create_user('ws-check', password='ws-check-pass-2026', id=10)"
          token=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"username":"ws-check","password":"ws-check-pass-2026"}' http://localhost:8000/api/auth/token \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).access_token))")
          node --no-warnings --experimental-strip-types .github/scripts/websocket-check.mjs \
            ws://localhost:8000/ws/notifications/ "$token" 15 &
          check=$!
          sleep 17
          docker exec d-gui-manager-web python manage.py shell -c \
            "from xterm.consumers import send_notification_to_group; send_notification_to_group({'action': 'CI', 'details': 'still listening'}, owner_id=10)"
          wait "$check"
      - name: Logs
        if: always()
        run: docker compose logs --no-color backend traefik | tail -n 200
